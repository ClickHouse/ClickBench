[package]
name = "clickbench-infino"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "clickbench-infino"
path = "src/main.rs"

[dependencies]
infino = "0.1.10"
arrow = "58"
arrow-array = "58"
arrow-schema = "58"
parquet = "58"
glob = "0.3"

# Default to thin LTO so the build fits any machine (see ./install). On boxes
# with RAM to spare, install raises this to fat LTO + codegen-units=1 via the
# CARGO_PROFILE_RELEASE_* env vars for the best codegen.
[profile.release]
opt-level = 3
lto = "thin"
