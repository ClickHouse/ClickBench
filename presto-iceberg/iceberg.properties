# The Iceberg REST catalog. The placeholders are substituted from
# lib/iceberg/env.sh by ./install.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest.uri={LAKE_CATALOG_URI}
iceberg.catalog.warehouse={LAKE_WAREHOUSE_LOCATION}/
iceberg.rest.auth.type=OAUTH2
iceberg.rest.auth.oauth2.uri={LAKE_OAUTH_URI}
iceberg.rest.auth.oauth2.credential={LAKE_CLIENT_ID}:{LAKE_CLIENT_SECRET}
iceberg.rest.auth.oauth2.scope=catalog
hive.s3.use-instance-credentials=false
hive.s3.aws-access-key={AWS_ACCESS_KEY_ID}
hive.s3.aws-secret-key={AWS_SECRET_ACCESS_KEY}
hive.s3.endpoint={LAKE_S3_ENDPOINT}
hive.s3.path-style-access={LAKE_S3_PATH_STYLE}
hive.s3.ssl.enabled={LAKE_S3_USE_SSL}
