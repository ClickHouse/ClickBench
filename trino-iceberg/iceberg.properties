# The Iceberg REST catalog. The placeholders are substituted from
# lib/iceberg/env.sh by ./install.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri={LAKE_CATALOG_URI}
iceberg.rest-catalog.warehouse={LAKE_WAREHOUSE}
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.credential={LAKE_CLIENT_ID}:{LAKE_CLIENT_SECRET}
iceberg.rest-catalog.oauth2.server-uri={LAKE_OAUTH_URI}
iceberg.rest-catalog.oauth2.scope=catalog
fs.native-s3.enabled=true
s3.endpoint={LAKE_S3_ENDPOINT}
s3.region={AWS_REGION}
s3.path-style-access={LAKE_S3_PATH_STYLE}
s3.aws-access-key={AWS_ACCESS_KEY_ID}
s3.aws-secret-key={AWS_SECRET_ACCESS_KEY}
