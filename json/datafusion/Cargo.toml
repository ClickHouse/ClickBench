[package]
name = "jsonbench-datafusion"
version = "0.1.0"
edition = "2024"
description = "DataFusion with datafusion-functions-json for JSONBench"
publish = false

[dependencies]
datafusion = "55"
datafusion-functions-json = "0.55.6"
flate2 = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.release]
codegen-units = 1
lto = "thin"
