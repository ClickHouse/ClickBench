name: "Randomized benchmark trial"

# Temporary: a trial group of the randomized benchmark from the branch of
# PR #3271, before random-benchmark.yml is on main (workflow_dispatch needs
# that). Remove before merging. Run 3: after the fix of the version without models.

on:
  push:
    branches: [randomized-benchmark]
    paths: [".github/workflows/random-benchmark-trial.yml"]

permissions:
  id-token: write  # To assume the federated IAM role.
  contents: read

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install anthropic openai

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::264113785604:role/ClickBenchLauncher
          aws-region: us-east-1
          role-session-name: clickbench-random-trial-${{ github.run_id }}

      # Run 6: rayforce again in group 2ce46201 (the same seed and payload),
      # with query.rfl printing CSV from a variable per query.
      - shell: bash
        env:
          machine: c6a.4xlarge
          system: rayforce
          group: 2ce46201-be57-4fc3-9daf-684c4c53b85d
          seed: cec2dddbb33edbbb3a4689457085fddb
          rows: "100000000"
          clickhouse_version: 26.10.2.103-stable
          parallel: "4"
          repeats: "3"
          query_timeout: "600"
          payload_hash: b72030a70bcae8cd3bf96b69fb1cae25c5fe58024466f25234ed46baf95bd316
          repo: ${{ github.repository }}
          branch: randomized-benchmark
        run: ./random/run-benchmark.sh

