name: "Randomized benchmark trial"

# Temporary: a group of the randomized benchmark from the branch of PR #3271,
# before random-benchmark.yml is on main (workflow_dispatch needs that).
# Remove before merging. Group 3 (1492dae5): doris again with the generated files
# (its load called the download script itself), and hyper with the original layout.

on:
  push:
    branches: [randomized-benchmark]
    paths: [".github/workflows/random-benchmark-trial.yml"]

permissions:
  id-token: write  # To assume the federated IAM role.
  contents: read

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install anthropic openai duckdb

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::264113785604:role/ClickBenchLauncher
          aws-region: us-east-1
          role-session-name: clickbench-random-trial-${{ github.run_id }}

      # doris and hyper again in group 1492dae5 (the same seed and payloads):
      # doris loaded the original dataset through its own call of the download
      # script; hyper ran with row groups adjusted to its limits.
      - shell: bash
        env:
          machine: c6a.metal
          group: 1492dae5-02e4-41bb-bfb6-7772b6557b42
          seed: d70a416ebe9dcd991754b6144f3f0f7e
          rows: "1000000000"
          clickhouse_version: 26.10.2.103-stable
          parallel: "4"
          repeats: "3"
          query_timeout: "600"
          repo: ${{ github.repository }}
          branch: randomized-benchmark
        run: |
          system=doris payload_hash=4843c3dea5ed38ff64d7d01d3f2704cbd0644ee201e4482975c903865868b9f3 ./random/run-benchmark.sh
          system=hyper payload_hash=ae1144c0f98e91bacf0f4147248538fb8f8ff25a4f2506f22fc34b4bceb8b608 ./random/run-benchmark.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: random-group
          path: |
            random-group/queries.json
            random-group/translated/
            random-group/generate.log
