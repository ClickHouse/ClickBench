name: "Randomized benchmark trial"

# Temporary: a group of the randomized benchmark from the branch of PR #3271,
# before random-benchmark.yml is on main (workflow_dispatch needs that).
# Remove before merging. Group 3 (1492dae5): gizmosql again, with CSV output
# (retry: the previous launch could not resolve the latest GizmoSQL release).

on:
  push:
    branches: [randomized-benchmark]
    paths: [".github/workflows/random-benchmark-trial.yml"]

permissions:
  id-token: write  # To assume the federated IAM role.
  contents: read

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install anthropic openai duckdb

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::264113785604:role/ClickBenchLauncher
          aws-region: us-east-1
          role-session-name: clickbench-random-trial-${{ github.run_id }}

      # gizmosql again in group 1492dae5 (the same seed and payload): its box
      # output cut wide values, which could not be compared with the reference.
      - shell: bash
        env:
          machine: c6a.metal
          group: 1492dae5-02e4-41bb-bfb6-7772b6557b42
          seed: d70a416ebe9dcd991754b6144f3f0f7e
          rows: "1000000000"
          clickhouse_version: 26.10.2.103-stable
          parallel: "4"
          repeats: "3"
          query_timeout: "600"
          repo: ${{ github.repository }}
          branch: randomized-benchmark
        run: |
          system=gizmosql payload_hash=be6a6b998ac335018cd7e6adbba3110f9b749d3f4336b533de34a2ecdcd85b1c ./random/run-benchmark.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: random-group
          path: |
            random-group/queries.json
            random-group/translated/
            random-group/generate.log
