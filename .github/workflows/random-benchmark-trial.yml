name: "Randomized benchmark trial"

# Temporary: a group of the randomized benchmark from the branch of PR #3271,
# before random-benchmark.yml is on main (workflow_dispatch needs that).
# Scrutiny of two new entrants, ParticleDB (https://github.com/ClickHouse/ClickBench/pull/2952)
# and WaveDB (https://github.com/ClickHouse/ClickBench/pull/3160), with ClickHouse for comparison:
# a new group on c6a.4xlarge, the only machine with results of all three in the main benchmark.
# This branch is not for merging. (Relaunched after the fix of the parsing of BENCH_DOWNLOAD_SCRIPT.)

on:
  push:
    branches: [random-scrutiny-particledb-wavedb]
    paths: [".github/workflows/random-benchmark-trial.yml"]

permissions:
  id-token: write  # To assume the federated IAM role.
  contents: read

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install anthropic openai

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::264113785604:role/ClickBenchLauncher
          aws-region: us-east-1
          role-session-name: clickbench-random-trial-${{ github.run_id }}

      - shell: bash
        env:
          SYSTEMS: "clickhouse particledb wavedb"
          MACHINES: "c6a.4xlarge"
          RANDOM_ROWS: "100000000"
          RANDOM_QUERIES: "100"
          RANDOM_PARALLEL_QUERIES: "4"
          RANDOM_REPEATS: "3"
          RANDOM_QUERY_TIMEOUT: "600"
          RANDOM_LLM_BACKEND: "anthropic"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OUT: ${{ github.workspace }}/random-group
          repo: ${{ github.repository }}
          branch: random-scrutiny-particledb-wavedb
        run: ./random/launch.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: random-group
          path: |
            random-group/queries.json
            random-group/translated/
            random-group/generate.log
