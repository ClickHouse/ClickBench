name: "Randomized benchmark trial"

# Temporary: a group of the randomized benchmark from the branch of PR #3271,
# before random-benchmark.yml is on main (workflow_dispatch needs that).
# Scrutiny of two new entrants, ParticleDB (https://github.com/ClickHouse/ClickBench/pull/2952)
# and WaveDB (https://github.com/ClickHouse/ClickBench/pull/3160), with ClickHouse for comparison:
# a new group on c6a.4xlarge, the only machine with results of all three in the main benchmark.
# This branch is not for merging. Group 729fa873; particledb and wavedb again after the driver fix.

on:
  push:
    branches: [random-scrutiny-particledb-wavedb]
    paths: [".github/workflows/random-benchmark-trial.yml"]

permissions:
  id-token: write  # To assume the federated IAM role.
  contents: read

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install anthropic openai

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::264113785604:role/ClickBenchLauncher
          aws-region: us-east-1
          role-session-name: clickbench-random-trial-${{ github.run_id }}

      # particledb and wavedb again in group 729fa873 (the same seed and
      # payloads), after the fix of the driver: the workers wait while a system
      # that went down is restarted.
      - shell: bash
        env:
          machine: c6a.4xlarge
          group: 729fa873-daa0-478c-8c79-163bebd5ab65
          seed: eb4ecf7061be27a22d8f9e4a81cbf564
          rows: "100000000"
          clickhouse_version: 26.10.2.103-stable
          parallel: "4"
          repeats: "3"
          query_timeout: "600"
          repo: ${{ github.repository }}
          branch: random-scrutiny-particledb-wavedb
        run: |
          system=particledb payload_hash=a4333fcffd007bbefbaa1261a61e4db2ff68f93f76768c19bd5d3fe7d8d5535a ./random/run-benchmark.sh
          system=wavedb payload_hash=dd4ad2441af8d09181b335b2fc5708eebeec0d629fbf01c22f8f014076e61b78 ./random/run-benchmark.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: random-group
          path: |
            random-group/queries.json
            random-group/translated/
            random-group/generate.log
