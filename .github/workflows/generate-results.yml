name: "Build the website"
on:
  workflow_dispatch:  # This allows manual trigger from the UI
  # Most pushes to main come from automation authenticated as the
  # clickbench-automation App (the auto-merged `auto-results/*` PRs and the
  # daily ClickHouse Cloud commit). Those do trigger `push` below; this
  # workflow's own commit is skipped by its `if`. The schedule stays as a
  # fallback.
  schedule:
    - cron: '25 * * * *'
  push:
    branches:
      - main

permissions:
  contents: write

# The scheduled run and a push run must not race on `git push`.
concurrency:
  group: generate-results

jobs:
  build:
    runs-on: ubuntu-latest
    # Holds the clickbench-automation App key; main-only. Pushes to main
    # and the auto-merges go through the App, which bypasses review.
    environment: automation
    env:
      CI_COMMIT_MESSAGE: "[bot] Build the website"
      CI_COMMIT_AUTHOR: github
    steps:
    - name: Create clickbench-automation token
      id: app-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        app-id: ${{ vars.CLICKBENCH_AUTOMATION_APP_ID }}
        private-key: ${{ secrets.CLICKBENCH_AUTOMATION_PRIVATE_KEY }}
        owner: ClickHouse
        repositories: ClickBench
    - uses: actions/checkout@v3
      with:
        token: ${{ steps.app-token.outputs.token }}
    - if: github.event.commits[0].message != env.CI_COMMIT_MESSAGE
      run: |
        bash generate-results.sh
        cd hardware && bash generate-results.sh && cd -
        cd json && bash generate-results.sh && cd -

        git config --global user.name "${{ env.CI_COMMIT_AUTHOR }}"
        git config --global user.email "${{ env.CI_COMMIT_AUTHOR }}@users.noreply.github.com"

        git add -A
        if git status | grep -q modified
        then
          git commit -m "${{ env.CI_COMMIT_MESSAGE }}"
          # Results can land between the checkout and the push.
          git pull --rebase
          git push
        fi
