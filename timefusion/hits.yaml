  - { name: JavaEnable, data_type: 'Int32', nullable: false }
  - { name: Title, data_type: 'Utf8', nullable: false }
  - { name: GoodEvent, data_type: 'Int32', nullable: false }
  - { name: EventTime, data_type: 'Timestamp(Microsecond, Some("UTC"))', nullable: false }
  - { name: EventDate, data_type: 'Date32', nullable: false }
  - { name: CounterID, data_type: 'Int32', nullable: false }
