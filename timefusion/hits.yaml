# ClickBench `hits` table. TimeFusion only serves tables declared in compiled-in
# schema files, so ./install copies this file into the source tree before building.
# There is no 16-bit integer type, so SMALLINT columns are Int32.
table_name: hits
# No `time_column` and no partitions: TimeFusion rewrites predicates on the time
# column into filters on a `date` partition column, which this table does not have.
partitions: []
# Same sort key as the primary key of the ClickHouse entry.
sorting_columns:
  - { name: CounterID, descending: false, nulls_first: false }
  - { name: EventDate, descending: false, nulls_first: false }
  - { name: UserID, descending: false, nulls_first: false }
  - { name: EventTime, descending: false, nulls_first: false }
  - { name: WatchID, descending: false, nulls_first: false }
z_order_columns: []
fields:
