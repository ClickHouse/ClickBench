[package]
name = "mechanicus_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "mechanicus_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module", "abi3-py37"] }
numpy = "0.20"
rayon = "1.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
